<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1330" viewBox="0 0 720 1330" fill="none" role="img"><title>五个功能模块：学术表达、段落改写、报告定位、中文语体、保真复核</title><g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"><rect x="0" y="0" width="720" height="1330" rx="18" fill="#F3EEE5" stroke="none"/><text x="32" y="49" fill="#BC3928" font-size="17" font-weight="600" letter-spacing="2">THE TOOLKIT / 05 MODULES</text><text x="30" y="111" fill="#282420" font-size="44" font-weight="600" >完整流程，清楚分工。</text><rect x="32" y="158" width="656" height="210" rx="10" fill="#292622" stroke="#292622"/><text x="62" y="192" fill="#FF846B" font-size="16" font-weight="600" letter-spacing="2">01</text><text x="102" y="192" fill="#D4C9BC" font-size="12" font-weight="500" letter-spacing="1.1">ACADEMIC STYLE</text><text x="62" y="250" fill="#F8F2E8" font-size="42" font-weight="650" >学术表达</text><text x="62" y="297" fill="#D4C9BC" font-size="28" font-weight="400" >固定事实与专业术语，</text><text x="62" y="335" fill="#D4C9BC" font-size="28" font-weight="400" >调整正式书面表达。</text><path d="M624 212h20v20M644 212l-22 22" stroke="#FF846B" stroke-width="2" stroke-linecap="square"/><rect x="32" y="384" width="656" height="210" rx="10" fill="#FFFCF6" stroke="#E2D9CD"/><text x="62" y="418" fill="#C3402E" font-size="16" font-weight="600" letter-spacing="2">02</text><text x="102" y="418" fill="#716960" font-size="12" font-weight="500" letter-spacing="1.1">PARAGRAPH REVISION</text><text x="62" y="476" fill="#292622" font-size="42" font-weight="650" >段落改写</text><text x="62" y="523" fill="#716960" font-size="28" font-weight="400" >按段落功能重组句法，</text><text x="62" y="561" fill="#716960" font-size="28" font-weight="400" >兼顾篇幅与信息完整性。</text><path d="M624 438h20v20M644 438l-22 22" stroke="#C3402E" stroke-width="2" stroke-linecap="square"/><rect x="32" y="610" width="656" height="210" rx="10" fill="#FFFCF6" stroke="#E2D9CD"/><text x="62" y="644" fill="#C3402E" font-size="16" font-weight="600" letter-spacing="2">03</text><text x="102" y="644" fill="#716960" font-size="12" font-weight="500" letter-spacing="1.1">REPORT MAPPING</text><text x="62" y="702" fill="#292622" font-size="42" font-weight="650" >报告定位</text><text x="62" y="749" fill="#716960" font-size="28" font-weight="400" >将报告标记对应到原文，</text><text x="62" y="787" fill="#716960" font-size="28" font-weight="400" >理清段落与版本。</text><path d="M624 664h20v20M644 664l-22 22" stroke="#C3402E" stroke-width="2" stroke-linecap="square"/><rect x="32" y="836" width="656" height="210" rx="10" fill="#FFFCF6" stroke="#E2D9CD"/><text x="62" y="870" fill="#C3402E" font-size="16" font-weight="600" letter-spacing="2">04</text><text x="102" y="870" fill="#716960" font-size="12" font-weight="500" letter-spacing="1.1">CHINESE EXPRESSION</text><text x="62" y="928" fill="#292622" font-size="42" font-weight="650" >中文语体</text><text x="62" y="975" fill="#716960" font-size="28" font-weight="400" >处理套话与冗余，</text><text x="62" y="1013" fill="#716960" font-size="28" font-weight="400" >保留清楚、克制的表达。</text><path d="M624 890h20v20M644 890l-22 22" stroke="#C3402E" stroke-width="2" stroke-linecap="square"/><rect x="32" y="1062" width="656" height="210" rx="10" fill="#FFFCF6" stroke="#E2D9CD"/><text x="62" y="1096" fill="#C3402E" font-size="16" font-weight="600" letter-spacing="2">05</text><text x="102" y="1096" fill="#716960" font-size="12" font-weight="500" letter-spacing="1.1">FIDELITY REVIEW</text><text x="62" y="1154" fill="#292622" font-size="42" font-weight="650" >保真复核</text><text x="62" y="1201" fill="#716960" font-size="28" font-weight="400" >核对数据、引文与限定，</text><text x="62" y="1239" fill="#716960" font-size="28" font-weight="400" >逐项检查新增和遗漏。</text><path d="M624 1116h20v20M644 1116l-22 22" stroke="#C3402E" stroke-width="2" stroke-linecap="square"/></g></svg>
