<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="684" viewBox="0 0 1200 684" fill="none" role="img"><title>五个功能模块：学术表达、段落改写、报告定位、中文语体、保真复核</title><g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"><rect x="0" y="0" width="1200" height="684" rx="16" fill="#F3EEE5" stroke="none"/><text x="48" y="50" fill="#BC3928" font-size="13" font-weight="650" letter-spacing="3">THE TOOLKIT</text><text x="46" y="108" fill="#282420" font-size="43" font-weight="600" >完整流程，清楚分工。</text><text x="1152" y="48" fill="#867D70" font-size="12" font-weight="500" text-anchor="end" letter-spacing="1.6">05 MODULES</text><rect x="48" y="150" width="542" height="234" rx="10" fill="#292622" stroke="#292622"/><text x="76" y="184" fill="#FF846B" font-size="16" font-weight="600" letter-spacing="2">01</text><text x="116" y="184" fill="#D4C9BC" font-size="12" font-weight="500" letter-spacing="1.1">ACADEMIC STYLE</text><text x="76" y="242" fill="#F8F2E8" font-size="38" font-weight="650" >学术表达</text><text x="76" y="289" fill="#D4C9BC" font-size="24" font-weight="400" >固定事实与专业术语，</text><text x="76" y="321" fill="#D4C9BC" font-size="24" font-weight="400" >调整正式书面表达。</text><path d="M526 204h20v20M546 204l-22 22" stroke="#FF846B" stroke-width="2" stroke-linecap="square"/><rect x="610" y="150" width="542" height="234" rx="10" fill="#FFFCF6" stroke="#E2D9CD"/><text x="638" y="184" fill="#C3402E" font-size="16" font-weight="600" letter-spacing="2">02</text><text x="678" y="184" fill="#716960" font-size="12" font-weight="500" letter-spacing="1.1">PARAGRAPH REVISION</text><text x="638" y="242" fill="#292622" font-size="38" font-weight="650" >段落改写</text><text x="638" y="289" fill="#716960" font-size="24" font-weight="400" >按段落功能重组句法，</text><text x="638" y="321" fill="#716960" font-size="24" font-weight="400" >兼顾篇幅与信息完整性。</text><path d="M1088 204h20v20M1108 204l-22 22" stroke="#C3402E" stroke-width="2" stroke-linecap="square"/><rect x="48" y="404" width="354" height="232" rx="10" fill="#FFFCF6" stroke="#E2D9CD"/><text x="76" y="438" fill="#C3402E" font-size="16" font-weight="600" letter-spacing="2">03</text><text x="116" y="438" fill="#716960" font-size="12" font-weight="500" letter-spacing="1.1">REPORT MAPPING</text><text x="76" y="496" fill="#292622" font-size="32" font-weight="650" >报告定位</text><text x="76" y="543" fill="#716960" font-size="21" font-weight="400" >将报告标记对应到原文，</text><text x="76" y="575" fill="#716960" font-size="21" font-weight="400" >理清段落与版本。</text><path d="M338 458h20v20M358 458l-22 22" stroke="#C3402E" stroke-width="2" stroke-linecap="square"/><rect x="423" y="404" width="354" height="232" rx="10" fill="#FFFCF6" stroke="#E2D9CD"/><text x="451" y="438" fill="#C3402E" font-size="16" font-weight="600" letter-spacing="2">04</text><text x="491" y="438" fill="#716960" font-size="12" font-weight="500" letter-spacing="1.1">CHINESE EXPRESSION</text><text x="451" y="496" fill="#292622" font-size="32" font-weight="650" >中文语体</text><text x="451" y="543" fill="#716960" font-size="21" font-weight="400" >处理套话与冗余，</text><text x="451" y="575" fill="#716960" font-size="21" font-weight="400" >保留清楚、克制的表达。</text><path d="M713 458h20v20M733 458l-22 22" stroke="#C3402E" stroke-width="2" stroke-linecap="square"/><rect x="798" y="404" width="354" height="232" rx="10" fill="#FFFCF6" stroke="#E2D9CD"/><text x="826" y="438" fill="#C3402E" font-size="16" font-weight="600" letter-spacing="2">05</text><text x="866" y="438" fill="#716960" font-size="12" font-weight="500" letter-spacing="1.1">FIDELITY REVIEW</text><text x="826" y="496" fill="#292622" font-size="32" font-weight="650" >保真复核</text><text x="826" y="543" fill="#716960" font-size="21" font-weight="400" >核对数据、引文与限定，</text><text x="826" y="575" fill="#716960" font-size="21" font-weight="400" >逐项检查新增和遗漏。</text><path d="M1088 458h20v20M1108 458l-22 22" stroke="#C3402E" stroke-width="2" stroke-linecap="square"/></g></svg>
